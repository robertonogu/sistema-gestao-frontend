<div class="grid">
	<div class="col-12">
		<div class="card">

            <div class="flex flex-column sm:flex-row align-items-center gap-4 mb-3">
                <div class="text-900 text-xl font-semibold">Saldos</div>
                <div class="flex sm:ml-auto">
                    <button
                        class="p-button-rounded"
                        icon="pi pi-download"
                        pButton
                        pTooltip="Exportar PDF"
                        tooltipPosition="bottom"
                        type="button"
                        [disabled]="loading || !balances.length"
                        (click)="exportPdf()"
                    ></button>
                </div>
            </div>

			<!-- Uma linha por tipo (Funcionários, Credores…) com as origens desse tipo por baixo; a ordem vem da API -->
			<p-table
                [tableStyle]="{ 'min-width': '30rem' }"
                [value]="balances"
                [loading]="loading"
                rowGroupMode="subheader"
                groupRowsBy="type"
            >
                <ng-template pTemplate="header">
                    <tr>
                        <th>Origem</th>
                        <th class="text-right">Saldo</th>
                        <th style="width: 4rem"></th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="groupheader" let-balance>
                    <tr pRowGroupHeader>
                        <td colspan="3" class="surface-100 text-900 font-bold">{{ groupLabel(balance.type) }}</td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-balance>
                    <tr class="cursor-pointer" (click)="openStatement(balance)">
                        <td>{{ balance.name }}</td>
                        <td class="text-right font-semibold" [ngClass]="balanceColor(balance.balance)">
                            {{ abs(balance.balance) | number: '1.2-2' }} €
                        </td>
                        <td class="text-right"><i class="pi pi-angle-right text-500"></i></td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr><td colspan="3" class="text-600">Sem origens.</td></tr>
                </ng-template>
            </p-table>

		</div>
	</div>
</div>
