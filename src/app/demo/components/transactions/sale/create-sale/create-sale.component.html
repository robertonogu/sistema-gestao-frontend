<div class="grid">
	<div class="col-12">
		<div class="card">
			
            <div class="flex flex-column sm:flex-row align-items-center gap-4 mb-3">
				<div class="text-900 text-xl font-semibold">Nova Venda</div>
				<div class="flex gap-2 sm:ml-auto">
                    <button 
						class="p-button-rounded p-button-outlined"
						(click)="back()" 
						icon="pi pi-arrow-left" 
						pButton 
						pTooltip="Voltar" 
						tooltipPosition="bottom" 
						type="button" 
					></button>
					<button 
						class="p-button-rounded"
						(click)="newSale()" 
						icon="pi pi-save" 
						label="Guardar" 
						pButton 
						tooltipPosition="bottom" 
						type="button" 
					></button>
                </div>
            </div>

			<div class="p-fluid p-formgrid grid">

				<div class="field col-12 md:col-4">
                    <label>Data</label>
					<p-calendar 
						dateFormat="dd/mm/yy"
                        [iconDisplay]="'input'" 
						inputId="icondisplay" 
						[(ngModel)]="date"
                        [showIcon]="true" 
                    />
				</div>

				<div class="field col-12 md:col-4">
					<label>Cliente</label>
					<div class="flex gap-2">
						<p-dropdown
							[(ngModel)]="selectedClient"
							(onChange)="getConstructions()"
	                        [options]="clientNames"
	                        optionLabel="name"
							optionValue="id"
	                        placeholder="Selecione um Cliente"
							styleClass="flex-1"
						/>
						<button
							pButton
							type="button"
							icon="pi pi-plus"
							class="p-button-outlined"
							pTooltip="Criar novo cliente"
							tooltipPosition="bottom"
							(click)="openQuickAddClient()"
						></button>
					</div>
				</div>

				<div class="field col-12 md:col-4">
					<label>Obra</label>
					<p-dropdown 
						emptyMessage="Nenhum resultado"
						[(ngModel)]="selectedConstruction"
                        [options]="constructionNames" 
                        optionLabel="name" 
						optionValue="constructionId"
                        placeholder="Selecione uma Obra" 
					/>
				</div>

                <div class="field col-12 md:col-4">
                    <label>Número de Documento</label>
					<span class="p-input-icon-left">
						<i class="pi pi-file"></i>
						<input 
							[(ngModel)]="documentNumber"
							pInputText 
							type="text" 
						/>
					</span>
				</div>

				<div class="field col-12 md:col-4">
					<label>Valor s/ IVA</label>
					<p-inputNumber 
						autocomplete="off"
						[minFractionDigits]="2" [maxFractionDigits]="2" suffix=" €" 
						inputId="currency-germany"
                        locale="en-US" [useGrouping]="false" 
						mode="decimal"
						[(ngModel)]="netValue"
					/>
				</div>

				<div class="field col-12 md:col-4">
					<label>IVA</label>
					<p-dropdown 
						[(ngModel)]="iva"
                        [options]="validIvaRates | keyvalue" 
                        optionLabel="value" 
						optionValue="value"
                        placeholder="Selecione uma Taxa" 
					>
						<ng-template let-option pTemplate="item">
							{{ option.value }}%
						</ng-template>
						<ng-template let-option pTemplate="selectedItem">
							{{ option !== undefined && option !== null ? option.value + '%' : '' }}
						</ng-template>
					</p-dropdown>
				</div>

				<div class="col-12 flex justify-content-end mt-2">
					<div class="text-right">
						<div class="text-500 text-sm">Valor Total (c/ IVA)</div>
						<div class="text-900 text-2xl font-bold">{{ totalValue | number: '1.2-2' }} €</div>
					</div>
				</div>

			</div>
		</div>
	</div>
</div>

<p-dialog
	header="Novo Cliente"
	[(visible)]="quickAddClientDialogVisible"
	[style]="{ width: '450px' }"
	[modal]="true"
	class="p-fluid"
	(onHide)="closeQuickAddClient()"
>
	<ng-template pTemplate="content">
		<div class="field">
			<label for="quickAddClientName" class="block font-bold mb-4">Nome</label>
			<input
				type="text"
				pInputText
				id="quickAddClientName"
				[(ngModel)]="quickAddClientName"
				[ngModelOptions]="{ standalone: true }"
				required
				autofocus
				[ngClass]="{ 'ng-invalid ng-dirty': quickAddClientSubmitted && !quickAddClientName }"
			/>
			<small class="p-error" *ngIf="quickAddClientSubmitted && !quickAddClientName">Nome é obrigatório.</small>
		</div>

		<div class="field">
			<label for="quickAddClientNif" class="block font-bold mb-4">NIF</label>
			<p-inputNumber id="quickAddClientNif" [(ngModel)]="quickAddClientNif" [ngModelOptions]="{ standalone: true }" [useGrouping]="false"></p-inputNumber>
		</div>
	</ng-template>

	<ng-template pTemplate="footer">
		<button pButton label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="closeQuickAddClient()"></button>
		<button pButton label="Guardar" icon="pi pi-check" class="p-button-text" (click)="saveQuickAddClient()"></button>
	</ng-template>
</p-dialog>

<p-toast />
