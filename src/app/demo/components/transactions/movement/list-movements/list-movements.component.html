<div class="grid">
	<div class="col-12">
		<div class="card">

            <div class="flex flex-column sm:flex-row align-items-center gap-4 mb-3">
                <div class="text-900 text-xl font-semibold">Movimentos</div>
                <div class="flex gap-2 sm:ml-auto">
                    <button
                        class="p-button-rounded p-button-outlined"
                        (click)="openNew()"
                        icon="pi pi-plus"
                        label="Nova"
                        pButton
                        type="button"
                    ></button>
                    <button
                        class="p-button-rounded"
                        icon="pi pi-download"
                        pTooltip="Exportar"
                        tooltipPosition="bottom"
                        pButton
                        type="button"
                    ></button>
                </div>
            </div>

			<p-table
                currentPageReportTemplate="{first} de {last} de {totalRecords} movimentos totais"
                [lazy]="true"
                [loading]="loading"
                (onLazyLoad)="nextPage($event)"
                [paginator]="true"
                [rows]="20"
                [rowsPerPageOptions]="[5, 10, 20, 50, 100]"
                styleClass="p-datatable-striped"
                [showCurrentPageReport]="true"
                [totalRecords]="totalRecords"
                [tableStyle]="{ 'min-width': '50rem' }"
                [value]="movements"
            >

                <ng-template pTemplate="header">
                    <tr>
                        <th>Data</th>
                        <th>De</th>
                        <th>Para</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-movement>
                    <tr>
                        <td>{{ movement.date | date: 'dd/MM/yyyy' }}</td>
                        <td>{{ movement.originAccount }}</td>
                        <td>{{ movement.targetAccount }}</td>
                        <td>{{ movement.value | currency: 'EUR' }}</td>
                        <td>
                            <p-button
                                pRipple
                                (click)="editMovement(movement)"
                                icon="pi pi-pencil"
                                class="mr-2"
                                [rounded]="true"
                                [text]="true"
                                severity="success"
                            />
                            <p-button
                                pRipple
                                icon="pi pi-trash"
                                severity="danger"
                                [rounded]="true"
                                [text]="true"
                            />
                        </td>
                    </tr>
                </ng-template>

            </p-table>

		</div>
	</div>
</div>

<p-dialog
    [header]="movement.movementId ? 'Editar Movimento' : 'Novo Movimento'"
    [(visible)]="movementDialog"
    [style]="{ width: '450px' }"
    [modal]="true"
    class="p-fluid"
    (onHide)="hideDialog()"
>
    <ng-template pTemplate="content">
        <div class="field">
            <label class="block font-bold mb-4">Data</label>
            <p-calendar
                [(ngModel)]="movement.date"
                dateFormat="dd/mm/yy"
                [iconDisplay]="'input'"
                [showIcon]="true"
                appendTo="body"
                [ngClass]="{ 'ng-dirty ng-invalid': submitted && !movement.date }"
            />
        </div>

        <div class="field">
            <label class="block font-bold mb-4">Valor</label>
            <p-inputNumber
                [(ngModel)]="movement.value"
                mode="currency"
                currency="EUR"
                locale="de-DE"
                autocomplete="off"
                [ngClass]="{ 'ng-dirty ng-invalid': submitted && !movement.value }"
            />
        </div>

        <div class="field">
            <label class="block font-bold mb-4">De</label>
            <p-dropdown
                [(ngModel)]="movement.originAccountId"
                [options]="accountNames"
                optionLabel="name"
                optionValue="objectId"
                placeholder="Selecione uma Conta"
                appendTo="body"
                [ngClass]="{ 'ng-dirty ng-invalid': submitted && !movement.originAccountId }"
            />
        </div>

        <div class="field">
            <label class="block font-bold mb-4">Para</label>
            <p-dropdown
                [(ngModel)]="movement.targetAccountId"
                [options]="accountNames"
                optionLabel="name"
                optionValue="objectId"
                placeholder="Selecione uma Conta"
                appendTo="body"
                [ngClass]="{ 'ng-dirty ng-invalid': submitted && !movement.targetAccountId }"
            />
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton pRipple label="Guardar" icon="pi pi-check" class="p-button-text" (click)="saveMovement()"></button>
    </ng-template>
</p-dialog>

<p-toast />
