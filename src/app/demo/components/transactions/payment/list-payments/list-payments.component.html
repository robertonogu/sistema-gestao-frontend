<div class="grid">
	<div class="col-12">
		<div class="card">

            <div class="flex flex-column sm:flex-row align-items-center gap-4 mb-3">
                <div class="text-900 text-xl font-semibold">Pagamentos</div>
                <div class="flex gap-2 sm:ml-auto">
                    <button 
                        class="p-button-rounded p-button-outlined"
                        (click)="newPayment()" 
                        icon="pi pi-plus" 
                        label="Novo"
                        pButton 
                        type="button" 
                    ></button>
                    <button 
                        class="p-button-rounded"
                        icon="pi pi-download" 
                        pTooltip="Exportar" 
                        tooltipPosition="bottom" 
                        pButton 
                        type="button" 
                    ></button>
                </div>
            </div>

			<p-table 
                currentPageReportTemplate="{first} de {last} de {totalRecords} pagamentos totais"
                [lazy]="true"
                [loading]="loading"
                (onLazyLoad)="nextPage($event)"
                [paginator]="true"
                [rows]="20"
                [rowsPerPageOptions]="[5, 10, 20, 50, 100]"
                styleClass="p-datatable-striped" 
                [showCurrentPageReport]="true"
                [totalRecords]="totalRecords"
                [tableStyle]="{ 'min-width': '50rem' }"
                [value]="payments"
            >

                <ng-template pTemplate="header">
                    <tr>
                        <th>Data</th>
                        <th>
                            <div class="flex align-items-center">
                                Origem
                                <p-columnFilter field="origin" matchMode="equals" display="menu"
                                    [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" [showApplyButton]="false" [showClearButton]="false">
                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                        <p-dropdown [ngModel]="value" [options]="originNames" optionLabel="name" optionValue="id"
                                            placeholder="Todas" [showClear]="true" [filter]="true" filterBy="name" appendTo="body" [style]="{ 'min-width': '14rem' }"
                                            (onChange)="filter($event.value)" />
                                    </ng-template>
                                </p-columnFilter>
                            </div>
                        </th>
                        <th>
                            <div class="flex align-items-center">
                                Número de Documento
                                <p-columnFilter field="documentNumber" matchMode="contains" display="menu"
                                    [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" [showApplyButton]="false" [showClearButton]="false">
                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                        <input type="text" pInputText [ngModel]="value" (ngModelChange)="filter($event)" placeholder="Pesquisar..." />
                                    </ng-template>
                                </p-columnFilter>
                            </div>
                        </th>
                        <th>Valor Pago</th>
                        <th>
                            <div class="flex align-items-center">
                                Método de Pagamento
                                <p-columnFilter field="paymentMethod" matchMode="equals" display="menu"
                                    [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" [showApplyButton]="false" [showClearButton]="false">
                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                        <p-dropdown [ngModel]="value" [options]="PaymentMethod | keyvalue" optionLabel="value" optionValue="key"
                                            placeholder="Todos" [showClear]="true" appendTo="body" [style]="{ 'min-width': '12rem' }"
                                            (onChange)="filter($event.value)" />
                                    </ng-template>
                                </p-columnFilter>
                            </div>
                        </th>
                        <th>Conta</th>
                        <th>Ações</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-payment>
                    <tr>
                        <td>{{ payment.date | date: 'dd/MM/yyyy' }}</td>
                        <td>{{ payment.origin }}</td>
                        <td>{{ payment.documentNumber }}</td>
                        <td class="text-red-500 font-semibold">- {{ payment.value | number: '1.2-2' }} €</td>
                        <td><span [class]="'payment-badge status-' + payment.paymentMethod.toLowerCase()">{{ PaymentMethod[payment.paymentMethod] }}</span></td>
                        <td>{{ payment.account }}</td>
                        <td>
                            <p-button 
                                pRipple 
                                icon="pi pi-pencil" 
                                class="mr-2" 
                                [rounded]="true" 
                                [text]="true" 
                                severity="success" 
                            />
                            <p-button 
                                pRipple 
                                icon="pi pi-trash" 
                                severity="danger" 
                                [rounded]="true" 
                                [text]="true" 
                            />
                        </td>
                    </tr>
                </ng-template>
                
            </p-table>

		</div>
	</div>
</div>
