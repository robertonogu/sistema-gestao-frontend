<div class="grid">
	<div class="col-12">
		<div class="card">

			<div class="flex flex-column sm:flex-row align-items-center gap-4 mb-3">
				<div class="text-900 text-xl font-semibold">Nova Saída de Artigos</div>
				<div class="flex gap-2 sm:ml-auto">
                    <button
						class="p-button-rounded p-button-outlined"
						(click)="back()"
						icon="pi pi-arrow-left"
						pButton
						pTooltip="Voltar"
						tooltipPosition="bottom"
						type="button"
					></button>
					<button
						class="p-button-rounded"
						(click)="saveStockExit()"
						[disabled]="saving"
						icon="pi pi-save"
						label="Guardar"
						pButton
						type="button"
					></button>
                </div>
            </div>

			<div class="p-fluid p-formgrid grid mt-3">

				<div class="field col-12 md:col-4">
                    <label>Data</label>
					<p-calendar
						[(ngModel)]="date"
						(onSelect)="loadStock()"
						dateFormat="dd/mm/yy"
                        [iconDisplay]="'input'"
                        [showIcon]="true"
                        inputId="icondisplay"
						[ngClass]="{ 'ng-dirty ng-invalid': !date }"
                    />
				</div>

                <div class="field col-12 md:col-4">
					<label>Obra</label>
					<p-dropdown
                        (onChange)="getSubItems()"
						[(ngModel)]="selectedConstruction"
                        [options]="constructionNames"
                        optionLabel="name"
						optionValue="constructionId"
						[filter]="true"
                        placeholder="Selecione uma Obra"
						[ngClass]="{ 'ng-dirty ng-invalid': !selectedConstruction }"
					/>
				</div>

                <div class="field col-12 md:col-4">
					<label>Sub-Item</label>
					<p-treeSelect
						[(ngModel)]="selectedBudgetNode"
						[options]="budgetTree"
						containerStyleClass="w-full"
						placeholder="Selecione um Sub-Item"
						appendTo="body"
						[ngClass]="{ 'ng-dirty ng-invalid': !selectedBudgetNode }"
					/>
				</div>

				<p-table
					[value]="articles"
					class="col-12"
					styleClass="p-datatable-striped"
				>

					<ng-template pTemplate="caption">
						<div class="flex align-items-center justify-content-between">
							Artigos em Stock
						</div>
					</ng-template>

					<ng-template pTemplate="header">
						<tr class="border-left-3 border-solid border-primary">
							<th>Código</th>
							<th>Nome</th>
							<th>Unidade</th>
							<th>Valor Unitário</th>
							<th>Quantidade em Stock</th>
							<th>Quantidade a Sair</th>
						</tr>
					</ng-template>

					<ng-template pTemplate="body" let-article let-i="rowIndex">
						<tr>
							<td class=font-bold>{{ article.code }}</td>
							<td>{{ article.name }}</td>
							<td>{{ article.unit }}</td>
							<td>{{ article.unitValue | number: '1.2-2' }} €</td>
							<td>{{ article.quantity | number:'1.0-2' }}</td>
							<td>
								<p-inputNumber
                                    [(ngModel)]="articleQuantities[i]"
                                    mode="decimal"
                                    [maxFractionDigits]="2"
									[min]="0"
									[max]="article.quantity"
									placeholder="Insira quantidade"
									[ngClass]="{ 'ng-dirty ng-invalid': exceedsStock(i) }"
								/>
							</td>
						</tr>
					</ng-template>

					<ng-template pTemplate="emptymessage">
						<tr>
							<td colspan="6">Não existem artigos em stock nesta data.</td>
						</tr>
					</ng-template>

            	</p-table>

			</div>
		</div>
	</div>
</div>

<p-toast />
