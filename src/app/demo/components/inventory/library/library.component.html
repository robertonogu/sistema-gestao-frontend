<div class="grid">
	<div class="col-12">
		<div class="card">
			<div class="text-900 text-xl font-semibold mb-3">Biblioteca</div>
			<p-table #dt
				[value]="books"
				[loading]="loading"
				[paginator]="true"
				[rows]="10"
				[rowsPerPageOptions]="[10, 25, 50]"
				[globalFilterFields]="['name', 'supplier', 'documentNumber']"
				styleClass="p-datatable-striped"
				[tableStyle]="{ 'min-width': '50rem' }">
				<ng-template pTemplate="caption">
					<span class="p-input-icon-left">
						<i class="pi pi-search"></i>
						<input pInputText type="text" placeholder="Pesquisar" (input)="dt.filterGlobal($any($event.target).value, 'contains')" />
					</span>
				</ng-template>
				<ng-template pTemplate="header">
					<tr>
						<th pSortableColumn="name">Título <p-sortIcon field="name"></p-sortIcon></th>
						<th pSortableColumn="date">Data <p-sortIcon field="date"></p-sortIcon></th>
						<th pSortableColumn="supplier">Fornecedor <p-sortIcon field="supplier"></p-sortIcon></th>
						<th>Documento</th>
						<th class="text-right">Quantidade</th>
						<th class="text-right">Valor</th>
					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-book>
					<tr>
						<td>{{ book.name }}</td>
						<td>{{ book.date | date:'dd/MM/yyyy' }}</td>
						<td>{{ book.supplier }}</td>
						<td>{{ book.documentNumber }}</td>
						<td class="text-right">{{ book.quantity }}</td>
						<td class="text-right">{{ book.totalValue | currency:'EUR' }}</td>
					</tr>
				</ng-template>
				<ng-template pTemplate="emptymessage">
					<tr><td colspan="6">Sem livros registados.</td></tr>
				</ng-template>
			</p-table>
		</div>
	</div>
</div>
