<div class="grid">
	<div class="col-12">
		<div class="card">

            <div class="flex flex-column sm:flex-row align-items-center gap-4 mb-3">
				<div class="text-900 text-xl font-semibold">Nova Ferramenta</div>
				<div class="flex gap-2 sm:ml-auto">
                    <button
						class="p-button-rounded p-button-outlined"
						(click)="back()"
						icon="pi pi-arrow-left"
						pButton
						pTooltip="Voltar"
						tooltipPosition="bottom"
						type="button"
					></button>
					<button
						class="p-button-rounded bg-red-500 border-red-500"
						icon="pi pi-trash"
						pButton
						pTooltip="Apagar"
						tooltipPosition="bottom"
						type="button"
					></button>
					<button
						class="p-button-rounded"
						(click)="newTool()"
						icon="pi pi-save"
						label="Guardar"
						pButton
						tooltipPosition="bottom"
						type="button"
					></button>
                </div>
            </div>

			<div class="p-fluid p-formgrid grid">

                <div class="field col-12 md:col-4">
                    <label>Código</label>
                    <input [(ngModel)]="code" type="text" pInputText />
                </div>

                <div class="field col-12 md:col-4">
                    <label>Nome</label>
                    <input [(ngModel)]="name" type="text" pInputText />
                </div>

                <div class="field col-12 md:col-4">
					<label>Estado</label>
					<p-dropdown
                        [(ngModel)]="selectedStatus"
                        [options]="toolStatus | keyvalue"
                        optionLabel="value"
                        optionValue="key"
                        placeholder="Selecione um Estado"
					/>
				</div>

                <div class="field col-12 md:col-4">
                    <label>Marca</label>
                    <input [(ngModel)]="brand" type="text" pInputText />
                </div>

                <div class="field col-12 md:col-4">
                    <label>Modelo</label>
                    <input [(ngModel)]="model" type="text" pInputText />
                </div>

                <div class="field col-12 md:col-4">
                    <label>Localização</label>
                    <input [(ngModel)]="location" type="text" pInputText />
                </div>

                <div class="field col-12 md:col-4">
					<label>Data de Compra</label>
					<p-calendar
                        [(ngModel)]="purchaseDate"
                        dateFormat="dd/mm/yy"
                        [iconDisplay]="'input'"
                        [showIcon]="true"
                        inputId="icondisplay"
                    />
				</div>

                <div class="field col-12 md:col-4">
                    <label>Valor de Compra</label>
                    <p-inputNumber
                        [(ngModel)]="purchaseValue"
                        mode="currency"
                        inputId="currency-germany"
                        currency="EUR"
                        locale="de-DE"
                    />
                </div>

			</div>
		</div>
	</div>
</div>

<p-toast />
