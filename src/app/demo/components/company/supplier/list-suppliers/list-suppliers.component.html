<div class="grid">
	<div class="col-12">
		<div class="card">

            <div class="flex flex-column sm:flex-row align-items-center gap-4 mb-3">
                <div class="text-900 text-xl font-semibold">Fornecedores</div>
                <span class="p-input-icon-left sm:ml-auto">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" placeholder="Pesquisar por nome" [(ngModel)]="searchName"
                        (ngModelChange)="onSearchChange($event)" />
                </span>
                <div class="flex gap-2">
                    <button
                        class="p-button-rounded p-button-outlined"
                        (click)="openNew()"
                        icon="pi pi-plus"
                        label="Novo"
                        pButton
                        type="button"
                    ></button>
                    <button 
                        class="p-button-rounded"
                        icon="pi pi-download" 
                        pTooltip="Exportar" 
                        tooltipPosition="bottom" 
                        pButton 
                        type="button" 
                    ></button>
                </div>
            </div>

			<p-table 
                #dt
                currentPageReportTemplate="{first} de {last} de {totalRecords} fornecedores"
                [lazy]="true"
                [loading]="loading"
                (onLazyLoad)="nextPage($event)"
                [paginator]="true"
                [rows]="20"
                [rowsPerPageOptions]="[5, 10, 20, 50, 100]"
                [showCurrentPageReport]="true"
                styleClass="p-datatable-striped" 
                [totalRecords]="totalRecords"
                [tableStyle]="{ 'min-width': '50rem' }"
                [value]="suppliers"
            >

                <ng-template pTemplate="header">
                    <tr>
                        <th>Nome</th>
                        <th>NIF</th>
                        <th>Endereço</th>
                        <th>Ações</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-supplier>
                    <tr>
                        <td>{{ supplier.name }}</td>
                        <td>{{ supplier.nif }}</td>
                        <td>{{ supplier.address }}</td>
                        <td>
                            <p-button
                                pRipple
                                icon="pi pi-pencil"
                                class="mr-2"
                                [rounded]="true"
                                [text]="true"
                                severity="success"
                                (click)="editSupplier(supplier)"
                            />
                            <p-button
                                pRipple
                                icon="pi pi-trash"
                                severity="danger"
                                [rounded]="true"
                                [text]="true"
                                (click)="deleteSupplier(supplier)"
                            />
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr><td colspan="4">{{ searchName.trim() ? 'Nenhum fornecedor encontrado com "' + searchName.trim() + '".' : 'Ainda não há fornecedores.' }}</td></tr>
                </ng-template>
                
            </p-table>

		</div>
	</div>
</div>

<app-supplier-form-dialog (saved)="reload()"></app-supplier-form-dialog>

<p-confirmDialog #cd>
    <ng-template pTemplate="headless" let-message>
        <div class="flex flex-column align-items-center p-5 surface-overlay border-round">
            <div class="border-circle bg-primary inline-flex justify-content-center align-items-center h-6rem w-6rem">
                <i class="pi pi-question text-5xl"></i>
            </div>
            <span class="font-bold text-2xl block mb-2 mt-4">
                {{ message.header }}
            </span>
            <p class="mb-0">{{ message.message }}</p>
            <div class="flex align-items-center gap-2 mt-4">
                <button
                    pButton
                    label="Eliminar"
                    (click)="cd.accept()"
                    class="bg-red-500 border-transparent text-white w-8rem text-red-500">
                </button>
                <button
                    pButton
                    label="Cancelar"
                    (click)="cd.reject()"
                    class="p-button-outlined w-8rem ">
                </button>
            </div>
        </div>
    </ng-template>
</p-confirmDialog>

<p-toast />
