<div class="grid">
  <div class="col-12">
    <div class="card">

      <div class="flex align-items-center gap-3 mb-3">
        <button
          class="p-button-rounded p-button-outlined"
          (click)="back()"
          icon="pi pi-arrow-left"
          pButton
          type="button"
        ></button>
        <div class="text-900 text-xl font-semibold">{{ itemName }}</div>
      </div>

      <p-table
        [value]="workLogs"
        [lazy]="true"
        [loading]="loading"
        (onLazyLoad)="loadPage($event)"
        [paginator]="true"
        [rows]="20"
        [rowsPerPageOptions]="[5, 10, 20, 50, 100]"
        [totalRecords]="totalRecords"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="{first} de {last} de {totalRecords} registos"
        styleClass="p-datatable-striped"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Data</th>
            <th>
              <div class="flex align-items-center">
                Funcionário
                <p-columnFilter field="employee" matchMode="equals" display="menu"
                  [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" [showApplyButton]="false" [showClearButton]="false">
                  <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                    <p-dropdown [ngModel]="value" [options]="employeeOptions" optionLabel="name" optionValue="id"
                      placeholder="Todos" [showClear]="true" appendTo="body" [style]="{ 'min-width': '14rem' }"
                      (onChange)="filter($event.value)" />
                  </ng-template>
                </p-columnFilter>
              </div>
            </th>
            <th>Horas</th>
            <th>Sub-item</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-log>
          <tr>
            <td>{{ log.date | date: 'dd/MM/yyyy' }}</td>
            <td>{{ log.employeeName }}</td>
            <td>{{ log.hours }} h</td>
            <td>{{ log.subItemName || '-' }}</td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr><td colspan="4">Sem registos de mão de obra para este item.</td></tr>
        </ng-template>
      </p-table>

    </div>
  </div>
</div>
