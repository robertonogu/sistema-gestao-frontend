<div class="grid">
  <div class="col-12">
    <div class="card">

      <div class="flex align-items-center gap-3 mb-3">
        <button
          class="p-button-rounded p-button-outlined"
          (click)="back()"
          icon="pi pi-arrow-left"
          pButton
          type="button"
        ></button>
        <div class="text-900 text-xl font-semibold">{{ title }}</div>
      </div>

      <p-table
        [value]="services"
        [lazy]="true"
        [loading]="loading"
        (onLazyLoad)="loadPage($event)"
        [paginator]="true"
        [rows]="20"
        [rowsPerPageOptions]="[5, 10, 20, 50, 100]"
        [totalRecords]="totalRecords"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="{first} de {last} de {totalRecords} registos"
        styleClass="p-datatable-striped"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Serviço</th>
            <th>Quantidade Alocada</th>
            <th>Valor Unitário</th>
            <th>Preço Total</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-service>
          <tr>
            <td>{{ service.name }}</td>
            <td>{{ service.quantity }}</td>
            <td>{{ fmtEUR(service.unitValue) }}</td>
            <td>{{ fmtEUR(service.totalValue) }}</td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr><td colspan="4">Sem serviços externos alocados.</td></tr>
        </ng-template>
      </p-table>

    </div>
  </div>
</div>
